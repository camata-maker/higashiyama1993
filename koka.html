<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校歌｜東山中14期生同窓会</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Klee+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c:#faf5ec; --c2:#f3e9d4;
  --br:#3d2b1f; --bm:#6b4a28;
  --go:#c8a060;
  --font:'Noto Serif JP','Yu Mincho','游明朝',serif;
}
body{
  font-family:var(--font);background:var(--c);color:var(--br);
  min-height:100vh;
}
header{
  background:#2a1a10;color:rgba(255,245,228,.9);
  text-align:center;padding:2.4rem 1.2rem 2rem;
  border-bottom:1px solid rgba(200,160,96,.3);
}
header .lbl{font-size:.78rem;letter-spacing:.42em;color:var(--go);margin-bottom:.8rem}
header h1{font-size:clamp(1.4rem,5vw,1.9rem);font-weight:400;letter-spacing:.14em}
header p{font-size:.85rem;color:rgba(255,245,228,.7);margin-top:.9rem;letter-spacing:.06em}

main{max-width:600px;margin:0 auto;padding:3rem 1.5rem 4rem}

.verse{margin-bottom:3rem}
.verse-num{
  display:block;text-align:center;
  font-size:.78rem;letter-spacing:.3em;color:var(--go);
  margin-bottom:1.2rem;
}
.verse p{
  font-family:'Klee One',var(--font);
  font-size:clamp(1.05rem,3.6vw,1.25rem);
  line-height:2.5;text-align:center;
  color:var(--br);font-weight:400;
}

.rule-c{width:36px;height:1px;background:var(--go);margin:0 auto 3rem}

.back{
  display:block;width:fit-content;margin:1rem auto 0;padding:.7rem 1.8rem;
  border:1px solid var(--go);color:var(--br);
  font-size:.78rem;letter-spacing:.2em;text-decoration:none;
  transition:background .3s,color .3s;
}
.back:hover{background:var(--go);color:var(--c)}
</style>
</head>
<body>

<header>
  <p class="lbl">SCHOOL SONG</p>
  <h1>校歌</h1>
  <p>米子市立東山中学校</p>
</header>

<main>

  <div class="verse">
    <span class="verse-num">一</span>
    <p>
      朝雲におう大山を<br>
      松のみどりに透くところ<br>
      ここ東陵の園ひろく<br>
      さやかに　甍つらねつゝ<br>
      かがやき立てり　わが母校
    </p>
  </div>

  <div class="verse">
    <span class="verse-num">二</span>
    <p>
      木影に庭に　まなびやに<br>
      若きわれらの夢のせて<br>
      いまむつまじく　すこやかに<br>
      こゝろを磨き　身を鍛え<br>
      いそしむ日々の　たのしさよ
    </p>
  </div>

  <div class="verse">
    <span class="verse-num">三</span>
    <p>
      文化の華と咲きいでて<br>
      明日へ薫らん人の世に<br>
      わがたましいの　故郷と<br>
      仰がん　東山中の<br>
      校風永遠に栄あれ
    </p>
  </div>

  <div class="rule-c"></div>

  <a href="./index.html" class="back">トップへ戻る　→</a>

</main>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部活動の恩師｜東山中14期生同窓会</title>
<link rel="icon" type="image/jpeg" href="assets/img/site/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Klee+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c:#faf5ec; --c2:#f3e9d4;
  --br:#3d2b1f; --bm:#6b4a28; --bl:#9a7a5a;
  --go:#c8a060;
  --font:'Noto Serif JP','Yu Mincho','游明朝',serif;
}
body{
  font-family:var(--font);background:var(--c);color:var(--br);
  min-height:100vh;
}
header{
  background:#2a1a10;color:rgba(255,245,228,.9);
  text-align:center;padding:2.4rem 1.2rem 2rem;
  border-bottom:1px solid rgba(200,160,96,.3);
}
header .lbl{font-size:.78rem;letter-spacing:.42em;color:var(--go);margin-bottom:.8rem}
header h1{font-size:clamp(1.4rem,5vw,1.9rem);font-weight:400;letter-spacing:.14em}
header p{font-size:.85rem;color:rgba(255,245,228,.7);margin-top:.9rem;letter-spacing:.06em}

main{max-width:640px;margin:0 auto;padding:3rem 1.5rem 4rem}

.note{
  font-size:.78rem;color:var(--bl);text-align:center;
  margin-bottom:2.2rem;letter-spacing:.04em;
}

.buk-list{border-top:1px solid rgba(200,160,96,.3)}
.buk-item{
  display:flex;align-items:center;gap:1.2rem;
  padding:.9rem .2rem;
  border-bottom:1px solid rgba(200,160,96,.25);
}
.buk-name{
  flex-shrink:0;width:8em;
  font-size:.92rem;font-weight:700;color:var(--br);
  letter-spacing:.03em;
}
.buk-teachers{
  font-size:.88rem;color:var(--bm);line-height:1.7;
}

.rule-c{width:36px;height:1px;background:var(--go);margin:3rem auto}

.back{
  display:block;width:fit-content;margin:1rem auto 0;padding:.7rem 1.8rem;
  border:1px solid var(--go);color:var(--br);
  font-size:.78rem;letter-spacing:.2em;text-decoration:none;
  transition:background .3s,color .3s;
}
.back:hover{background:var(--go);color:var(--c)}
</style>
</head>
<body>

<header>
  <p class="lbl">CLUB ADVISORS</p>
  <h1>部活動の恩師</h1>
  <p>米子市立東山中学校</p>
</header>

<main>

  <p class="note">※卒業アルバムより</p>

  <div class="buk-list">
    <div class="buk-item"><span class="buk-name">野球部</span><span class="buk-teachers">勝部 先生</span></div>
    <div class="buk-item"><span class="buk-name">バスケ部</span><span class="buk-teachers">松本 先生・栗原 先生</span></div>
    <div class="buk-item"><span class="buk-name">サッカー部</span><span class="buk-teachers">小原 先生</span></div>
    <div class="buk-item"><span class="buk-name">バレー部</span><span class="buk-teachers">岡田 先生・田辺 先生</span></div>
    <div class="buk-item"><span class="buk-name">卓球部</span><span class="buk-teachers">安田 先生・近藤 先生</span></div>
    <div class="buk-item"><span class="buk-name">ソフトボール部</span><span class="buk-teachers">松上 先生</span></div>
    <div class="buk-item"><span class="buk-name">水泳部</span><span class="buk-teachers">田中 先生</span></div>
    <div class="buk-item"><span class="buk-name">テニス部</span><span class="buk-teachers">加藤（雄）先生・熊谷 先生</span></div>
    <div class="buk-item"><span class="buk-name">剣道部</span><span class="buk-teachers">青木 先生</span></div>
    <div class="buk-item"><span class="buk-name">陸上部</span><span class="buk-teachers">太田 先生</span></div>
    <div class="buk-item"><span class="buk-name">弓道部</span><span class="buk-teachers">瀧川 先生</span></div>
    <div class="buk-item"><span class="buk-name">駅伝部</span><span class="buk-teachers">太田 先生・松上 先生・田辺 先生</span></div>
    <div class="buk-item"><span class="buk-name">バドミントン部</span><span class="buk-teachers">加藤（久）先生・石谷 先生</span></div>
    <div class="buk-item"><span class="buk-name">美術部</span><span class="buk-teachers">岸信 先生</span></div>
    <div class="buk-item"><span class="buk-name">吹奏楽部</span><span class="buk-teachers">高木 先生</span></div>
  </div>

  <div class="rule-c"></div>

  <a href="./index.html" class="back">トップへ戻る　→</a>

</main>
</body>
</html>
